services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rebnd
      POSTGRES_PASSWORD: rebnd_local
      POSTGRES_DB: rebnd
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rebnd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebnd -d rebnd"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rebnd_postgres:
